font_family                 Inconsolata Nerd Font Mono
bold_font                   auto
italic_font                 auto
bold_italic_font            auto
font_size                   13.5
disable_ligatures           never
symbol_map U+E000-U+F8FF,U+F0000-U+FFFFD JetBrainsMono Nerd Font Mono

cursor_shape                block
cursor_blink_interval       0
shell_integration           no-cursor
mouse_hide_wait             2.0
copy_on_select              no
url_style                   straight

repaint_delay               8
input_delay                 1
sync_to_monitor             yes
wayland_enable_ime          no
scrollback_lines            4000
enable_audio_bell           no
visual_bell_duration        0.0

remember_window_size        no
window_padding_width        2 4
placement_strategy          top-left
hide_window_decorations     yes
confirm_os_window_close     0
background_opacity          1.0

tab_bar_edge                top
tab_bar_style               powerline
tab_powerline_style         slanted
tab_bar_min_tabs            2

clear_all_shortcuts         yes
kitty_mod                   ctrl+shift

map kitty_mod+c             copy_to_clipboard
map kitty_mod+v             paste_from_clipboard
map shift+insert            paste_from_selection

map kitty_mod+equal         change_font_size all +1.0
map kitty_mod+plus          change_font_size all +1.0
map kitty_mod+minus         change_font_size all -1.0
map kitty_mod+0             change_font_size all 0
map kitty_mod+backspace     change_font_size all 0

map kitty_mod+u             kitten unicode_input
map kitty_mod+e             open_url_with_hints
map kitty_mod+f5            load_config_file
map kitty_mod+f2            show_kitty_doc overview

include themes/yorha-bunker.conf
