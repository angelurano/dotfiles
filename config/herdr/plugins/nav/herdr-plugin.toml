id = "nav"
name = "Smart Navigation"
version = "0.0.1"
min_herdr_version = "0.7.0"
description = "Seamless Ctrl+h/j/k/l navigation between Neovim splits and Herdr panes"

[[actions]]
id = "left"
title = "Smart navigate left"
command = ["python3", "nav.py", "left"]
description = "Smart navigate left"

[[actions]]
id = "down"
title = "Smart navigate down"
command = ["python3", "nav.py", "down"]
description = "Smart navigate down"

[[actions]]
id = "up"
title = "Smart navigate up"
command = ["python3", "nav.py", "up"]
description = "Smart navigate up"

[[actions]]
id = "right"
title = "Smart navigate right"
command = ["python3", "nav.py", "right"]
description = "Smart navigate right"
