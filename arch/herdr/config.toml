onboarding = false

[keys]
prefix = "ctrl+b"

copy_mode = "prefix+shift+v"
edit_scrollback = "prefix+shift+e"

toggle_sidebar = "prefix+e"

split_vertical = "prefix+v"
split_horizontal = "prefix+s"

close_pane = "prefix+q"
close_tab = "prefix+shift+x"
new_tab = ["prefix+t", "prefix+c"]
zoom = "prefix+z"

next_tab = ["prefix+tab", "prefix+n"]
previous_tab = "prefix+shift+tab"

last_pane = "prefix+space"

previous_agent = ["prefix+shift+a", "prefix+["]
next_agent = ["prefix+a", "prefix+]"]

settings = "prefix+shift+s"

goto = "prefix+p"
workspace_picker = "prefix+w"
new_worktree = "prefix+shift+g"
open_worktree = "prefix+g"
open_notification_target = "prefix+o"
detach = "prefix+shift+q"

switch_tab = "prefix+1..9"
switch_workspace = ["prefix+alt+1..9"]

[[keys.command]]
key = "prefix+y"
type = "pane"
command = "yazi"
description = "Yazi file manager popup"

[[keys.command]]
key = "prefix+b"
type = "popup"
command = "btop"
width = "88%"
height = "88%"
description = "Btop system monitor popup"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-nvim-nav.left"
description = "Smart navigate left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-nvim-nav.down"
description = "Smart navigate down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-nvim-nav.up"
description = "Smart navigate up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-nvim-nav.right"
description = "Smart navigate right"

[worktrees]
directory = "~/.local/share/herdr/worktrees"

[terminal]
kitty_graphics = true

[ui]
pane_gaps = false
sidebar_start_collapsed = true
accent = "#c8c2a9"
show_agent_labels_on_pane_borders = true
window_title = "Herdr [{workspace}]"

[theme]
name = "vesper"
auto_switch = false

[theme.custom]
sidebar_bg = "#1e1c1a"
active_row_bg = "#2c2925"
selection_bg = "#4e4b42"
panel_bg = "reset"
accent = "#c8c2a9"
red = "#cd664d"
green = "#8A9A7B"

[ui.toast]
delivery = "terminal"

[experimental]
pane_history = false

[advanced]
scrollback_limit_bytes = 2000000
