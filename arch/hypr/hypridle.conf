general {
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

# 1. Dim display after 2.5 minutes of inactivity
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 15%
    on-resume = brightnessctl -r
}

# 2. Power off display (DPMS off) after 5 minutes of inactivity
listener {
    timeout = 300
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# 3. Suspend laptop after 15 minutes ONLY when running on battery power
listener {
    timeout = 900
    condition_cmd = sh -c 'for ac in /sys/class/power_supply/AC* /sys/class/power_supply/ADP*; do [ -f "$ac/online" ] && [ "$(cat "$ac/online")" = "1" ] && exit 1; done; exit 0'
    condition_retry = 60
    on-timeout = systemctl suspend
}
